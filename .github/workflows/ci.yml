name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
    
    - run: uv sync --frozen --all-groups

    - run: uv run ruff check .
    - run: uv run ruff format --check .
  

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
    - run: uv sync --frozen --all-groups
    - run: uv run mypy

  
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true
    - run: uv sync --frozen --all-groups
    - run: uv run pytest -m "not integration" --cov --cov-report=term


  secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source . --verbose --redact --no-banner
  

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint promtool \
            prom/prometheus:v3.14.0 \
            check rules prometheus/talaia-rules.yml


  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python -m talaia.config config/monitors.yaml config/monitors.example.yaml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -m integration
  
  image:
    needs: [lint, typecheck, test, secrets, rules, config, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: talaia:CI
          cache-from: type=gha
          cache-to: type=gha, mode=max