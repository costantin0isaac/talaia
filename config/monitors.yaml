# Monitor configuration for this instance.
#
# The committed copy uses placeholder targets only. Real configuration lives on the
# deployment host and is mounted over this path via TALAIA_CONFIG_PATH.

defaults:
  interval: 60
  timeout: 10
  failure_threshold: 3
  recovery_threshold: 2

monitors:
  - name: example-webapp
    type: http
    target: http://10.0.0.10:3001
    group: services
    description: Example web application
    http:
      expected_status: [200]

  - name: example-router
    type: icmp
    target: 10.0.0.1
    group: infra
    interval: 30

  - name: example-ssh
    type: tcp
    target: 10.0.0.20:22
    group: infra
