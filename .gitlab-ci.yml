stages:
  - lint
  - typecheck
  - validate
  - test
  - build
  - deploy

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_FROZEN: "1"

.python:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen --all-groups
  after_script:
    - uv cache prune --ci

ruff:
  extends: .python
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0  # secret scanning needs the full history
  script:
    - gitleaks detect --source . --verbose --redact --no-banner

mypy:
  extends: .python
  stage: typecheck
  script:
    - uv run mypy

config:
  extends: .python
  stage: validate
  script:
    - uv run python -m talaia.config config/monitors.yaml

# The committed alerting rules are data, like monitors.yaml: parse them in CI rather than
# discovering a typo when Prometheus refuses to reload.
alert-rules:
  stage: validate
  image:
    name: prom/prometheus:v3.14.0
    entrypoint: [""]
  script:
    - promtool check rules prometheus/talaia-rules.yml

unit:
  extends: .python
  stage: test
  script:
    - uv run pytest -m "not integration" --cov --cov-report=term --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml

# Not named 'image': that is a reserved top-level keyword for the default job image,
# and GitLab rejects the whole pipeline if a job shadows it.
build-image:
  stage: build
  image: docker:28.5.2-cli
  services:
    - name: docker:28.5.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: 1
  script:
    # Built on every branch so a broken Dockerfile fails the merge request, but pushed only
    # from main and tags: nothing ever pulls a feature-branch image, and each one would
    # otherwise sit in the registry forever.
    - docker build --build-arg TALAIA_COMMIT="$CI_COMMIT_SHORT_SHA" --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ] && [ -z "$CI_COMMIT_TAG" ]; then
        echo "feature branch: image built, not pushed"
        exit 0
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi

integration:
  extends: .python
  stage: test
  services:
    - name: docker:28.5.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: 1
    # testcontainers talks to the dind daemon, and the container it starts is reachable
    # from this job at the dind host rather than at localhost.
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - uv run pytest -m integration --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml

# Runs on the shell-executor runner on the Docker host itself, so it can reach the
# deployment directory and the local Docker daemon. Manual on purpose: the pipeline says
# the image is good, a person says now is a good time.
production:
  stage: deploy
  tags:
    - shell
  environment:
    name: production
    url: $TALAIA_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
  variables:
    GIT_STRATEGY: none          # the checkout that matters is the one in TALAIA_DIR
  script:
    - cd "${TALAIA_DIR:-/opt/talaia}"
    # Fetch over HTTPS with the job's own token rather than whatever key happens to be on
    # the host: the runner user does not need an SSH key, and the token dies with the job.
    - |
      git fetch --prune \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
    # A hard reset, never a pull: it is what guarantees the host matches the repository
    # even if someone edited a file in place. A tag pipeline deploys that exact tag.
    - git reset --hard "${CI_COMMIT_TAG:-origin/$CI_DEFAULT_BRANCH}"
    # Deploy the image this pipeline built, rather than whatever TALAIA_TAG happens to say:
    # a tag pinned in .env turns the deploy button into a no-op that redeploys an old
    # release and looks green doing it. Written back to .env, not merely exported, so that
    # a later `docker compose up -d` by hand agrees with what is running instead of
    # silently rolling the host back to the pinned tag.
    - |
      tag="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      tmp=$(mktemp "$PWD/.env.XXXXXX")
      { grep -v '^TALAIA_TAG=' .env || true; echo "TALAIA_TAG=$tag"; } > "$tmp"
      cat "$tmp" > .env   # not mv: .env keeps its owner and 0660 mode
      rm -f "$tmp"
      echo "talaia: deploying $tag"
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker compose -f compose.prod.yaml pull
    - docker compose -f compose.prod.yaml up -d
    # Fail the deploy if it does not come up, so a red job means a broken release rather
    # than a job that merely finished. /readyz is non-200 until the database answers.
    - |
      for attempt in $(seq 30); do
        if curl -fsS -o /dev/null "http://127.0.0.1:${TALAIA_PORT:-9999}/readyz"; then
          echo "talaia: ready after ${attempt} attempt(s)"
          exit 0
        fi
        sleep 2
      done
      echo "talaia: did not become ready" >&2
      docker compose -f compose.prod.yaml logs --tail 50 app >&2
      exit 1
  after_script:
    - docker logout "$CI_REGISTRY" || true
