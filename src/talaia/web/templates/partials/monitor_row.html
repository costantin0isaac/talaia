<tr id="monitor-{{ row.name }}"
    class="monitor-row"
    data-status="{{ row.status }}"
    hx-get="/partials/monitors/{{ row.name }}/row"
    hx-trigger="every {{ poll_seconds }}s [!document.hidden]"
    hx-swap="outerHTML">
  <td class="cell-status">
    <span class="dot dot-{{ row.status }}" title="{{ row.status_label }}"></span>
  </td>
  <td class="cell-name">
    <a href="/monitors/{{ row.name }}">{{ row.name }}</a>
    <span class="badge">{{ row.type }}</span>
    {% if row.last_error %}<span class="error-hint" title="{{ row.last_error }}">{{ row.last_error }}</span>{% endif %}
  </td>
  <td class="cell-target"><code>{{ row.target }}</code></td>
  <td class="cell-latency">
    {{ row.last_latency }}
    {% if row.certificate %}<span class="cert-hint">{{ row.certificate }}</span>{% endif %}
  </td>
  <td class="cell-uptime">{{ row.uptime_24h }}</td>
  <td class="cell-strip" title="{{ row.strip_span or 'no checks recorded' }}">
    {% include "partials/strip.html" %}
  </td>
</tr>
