# Production deployment. See the README, "Deploying".
name: talaia

services:
  app:
    image: ${TALAIA_IMAGE:?set TALAIA_IMAGE in .env, e.g. registry.example.org/isaac/talaia}:${TALAIA_TAG:-latest}
    env_file: .env
    environment:
      TALAIA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-talaia}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-talaia}
      TALAIA_CONFIG_PATH: ${TALAIA_CONFIG_PATH:-/app/config/monitors.local.yaml}
    ports:
      # Published port because I run my http server on a different machine, you might not need it
      - "9999:9999"
    volumes:
      - ${TALAIA_CONFIG_DIR:-./config}:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    # Unprivileged ICMP needs the kernel to allow this GID range to open ping sockets.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-talaia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talaia} -d ${POSTGRES_DB:-talaia}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-talaia}
      POSTGRES_DB: ${POSTGRES_DB:-talaia}
      TALAIA_BACKUP_KEEP_DAYS: ${TALAIA_BACKUP_KEEP_DAYS:-14}
      TALAIA_BACKUP_EVERY_SECONDS: ${TALAIA_BACKUP_EVERY_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ${TALAIA_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /usr/local/bin/backup.sh || echo "talaia: backup failed"
          sleep "$${TALAIA_BACKUP_EVERY_SECONDS}"
        done
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
