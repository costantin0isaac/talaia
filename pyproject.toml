[project]
name = "talaia"
version = "0.1.0"
description = "A self-hosted uptime monitor for a homelab, configured declaratively in YAML."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]

# The full runtime stack is declared up front because it is fixed by the project
# specification. Individual modules arrive over the delivery phases, but pinning the
# dependency set now keeps `uv.lock` — and therefore the CI cache — stable.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.38",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "httpx>=0.28",
    "icmplib>=3.0",
    "prometheus-client>=0.24",
    "pyyaml>=6.0",
    "structlog>=25.5",
]

[project.urls]
Repository = "https://gitlab.costantino.es/isaac/talaia"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "testcontainers[postgres]>=4.14",
    "freezegun>=1.5",
    "ruff>=0.15",
    "mypy>=1.19",
    "types-pyyaml>=6.0",
]

# --------------------------------------------------------------------------------------
# Build backend: a src/ layout, so the installed package is what tests import.
# --------------------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talaia"]

[tool.uv]
# Install the project itself into the environment (editable) so `import talaia` works.
package = true

# --------------------------------------------------------------------------------------
# Ruff: linter and formatter in one tool. Replaces black, isort and flake8.
# --------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort: import ordering
    "N",      # pep8-naming
    "UP",     # pyupgrade: modern syntax for the target Python
    "B",      # flake8-bugbear: likely bugs
    "A",      # flake8-builtins: shadowing builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez: forbids naive datetimes, which matter for timestamptz
    "T20",    # flake8-print: no stray print(); this project logs with structlog
    "SIM",    # flake8-simplify
    "PTH",    # prefer pathlib over os.path
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async: blocking calls inside async functions
    "D",      # pydocstyle: this codebase is meant to be read
]
ignore = [
    "D107",  # missing docstring in __init__ — the class docstring covers it
    "D203",  # incompatible with D211; D211 is the modern choice
    "D213",  # incompatible with D212; D212 is the modern choice
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; full docstrings there are noise.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"migrations/**" = ["D103", "D100", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# --------------------------------------------------------------------------------------
# Mypy: strict from the first commit. Retro-fitting types is far more painful.
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["icmplib.*", "testcontainers.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "integration: requires a real PostgreSQL instance via testcontainers (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/talaia"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
