<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}talaia{% endblock %}</title>
  <script>
    // Applied before first paint: setting the attribute from the bottom of the page
    // would show one frame of the wrong theme on every navigation.
    (function () {
      try {
        var chosen = localStorage.getItem("talaia-theme");
        if (chosen === "light" || chosen === "dark") {
          document.documentElement.dataset.theme = chosen;
        }
      } catch (error) {
        // Private browsing can throw on access; the system preference still applies.
      }
    })();
  </script>
  <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ static_url('favicon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ static_url('apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script src="{{ static_url('htmx.min.js') }}" defer></script>
</head>
<body data-filter="all">
  <header class="masthead">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <polygon points="7,12 25,12 28,7.5 28,4 22.5,4 22.5,7.5 18.5,7.5 18.5,4 13.5,4 13.5,7.5 9.5,7.5 9.5,4 4,4 4,7.5" fill="currentColor"/>
          <polygon points="9,12 23,12 24.5,29 7.5,29" fill="currentColor"/>
          <rect x="11.5" y="17" width="4" height="7" fill="#e8743c"/>
        </svg>
      </span>
      <span class="brand-name">talaia</span>
    </a>
    <nav class="masthead-links">
      <a href="/incidents">Incidents</a>
      <a href="/docs">API</a>
      <a href="/metrics">Metrics</a>
      {% if grafana_url %}<a href="{{ grafana_url }}" rel="noopener" target="_blank">Grafana</a>{% endif %}
      <button type="button" id="theme-toggle" class="theme-toggle"
              aria-label="Switch between the light and dark theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      {% if user %}
      <form method="post" action="/logout" class="logout-form">
        <span class="masthead-user">{{ user.username }}</span>
        <button type="submit" class="linklike">Sign out</button>
      </form>
      {% endif %}
    </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      var STALE_AFTER = 60;
      function tick() {
        var el = document.querySelector(".freshness");
        if (!el) return;
        var age = Math.max(0, Math.round(Date.now() / 1000 - Number(el.dataset.updated)));
        el.textContent = age < 5 ? "just now" : age + "s ago";
        el.classList.toggle("stale", age > STALE_AFTER);
      }
      setInterval(tick, 1000);
      tick();
    })();

    (function () {
      var filters = document.querySelector(".filters");
      if (!filters) return;

      function apply(value) {
        document.body.dataset.filter = value;
        filters.querySelectorAll(".filter").forEach(function (button) {
          button.setAttribute("aria-pressed", String(button.dataset.filterValue === value));
        });
      }

      try {
        var saved = localStorage.getItem("talaia-filter");
        if (saved) apply(saved);
      } catch (error) {
        // Private browsing can throw; the default filter still applies.
      }

      filters.addEventListener("click", function (event) {
        var button = event.target.closest(".filter");
        if (!button) return;
        apply(button.dataset.filterValue);
        try {
          localStorage.setItem("talaia-filter", button.dataset.filterValue);
        } catch (error) {
          // Not persisting is survivable; the filter still works for this page.
        }
      });
    })();

    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.dataset.theme
        || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = current === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try {
        localStorage.setItem("talaia-theme", next);
      } catch (error) {
        // Not persisting is survivable; the toggle still works for this page.
      }
    });
  </script>

  <footer class="footer">
    Configuration lives in <code>monitors.yaml</code>, not here.
  </footer>
</body>
</html>
