# Production deployment. See the README, "Deploying".
#
# The image comes from the GitLab registry rather than being built here, so what runs is
# exactly what CI tested. Set TALAIA_IMAGE and TALAIA_TAG in .env alongside the secrets.

name: talaia

services:
  app:
    image: ${TALAIA_IMAGE:?set TALAIA_IMAGE in .env, e.g. registry.example.org/isaac/talaia}:${TALAIA_TAG:-latest}
    env_file: .env
    environment:
      TALAIA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-talaia}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-talaia}
      # Defaults to the git-ignored monitors.local.yaml so that `git reset --hard` on
      # upgrade cannot overwrite the real monitor list with the placeholder one.
      TALAIA_CONFIG_PATH: ${TALAIA_CONFIG_PATH:-/app/config/monitors.local.yaml}
    ports:
      # Published on the host because Caddy runs on a different machine; container-to-
      # container DNS does not cross hosts.
      - "9999:9999"
    volumes:
      - ${TALAIA_CONFIG_DIR:-./config}:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    # Unprivileged ICMP needs the kernel to allow this GID range to open ping sockets.
    # Without it every icmp monitor fails with a permission error.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-talaia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Deliberately no published port: nothing outside this stack talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talaia} -d ${POSTGRES_DB:-talaia}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dumps the database on a schedule. Shares the db image so pg_dump always matches the
  # server version, and the socket never leaves the stack.
  backup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-talaia}
      POSTGRES_DB: ${POSTGRES_DB:-talaia}
      TALAIA_BACKUP_KEEP_DAYS: ${TALAIA_BACKUP_KEEP_DAYS:-14}
      TALAIA_BACKUP_EVERY_SECONDS: ${TALAIA_BACKUP_EVERY_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ${TALAIA_BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /usr/local/bin/backup.sh || echo "talaia: backup failed"
          sleep "$${TALAIA_BACKUP_EVERY_SECONDS}"
        done
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
