[project]
name = "talaia"
version = "1.2.0"
description = "A self-hosted uptime monitor for a homelab, configured declaratively in YAML."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]

dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.38",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "httpx>=0.28",
    "icmplib>=3.0",
    "prometheus-client>=0.24",
    "pyyaml>=6.0",
    "structlog>=25.5",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.20",
    "tzdata>=2026.4",
]

[project.urls]
Repository = "https://gitlab.costantino.es/isaac/talaia"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "testcontainers[postgres]>=4.14",
    "freezegun>=1.5",
    "ruff>=0.15",
    "mypy>=1.19",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talaia"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "D",      # pydocstyle
]
ignore = [
    "D107",  # docstring in __init__
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"src/talaia/config/__main__.py" = ["T201"]  # a CLI prints to stdout
"src/talaia/auth/__main__.py" = ["T201"]    # a CLI prints to stdout
"migrations/**" = ["D103", "D100", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["icmplib.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --import-mode=importlib -W error::DeprecationWarning"
markers = [
    "integration: requires a real PostgreSQL instance via testcontainers (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["src/talaia"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
